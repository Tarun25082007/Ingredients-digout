spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/digout_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    async:
      request-timeout: 300000

logging:
  level:
    org.springframework: INFO
    com.digout: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  # Secret key should be a long, randomly generated secret key (at least 256 bits / 32 bytes for HS256)
  secret: ${JWT_SECRET}
  # Expiration time in milliseconds (86400000 ms = 24 hours)
  expiration: 86400000

gemini:
  api:
    key: ${GEMINI_API_KEY}

groq:
  api:
    key: ${GROQ_API_KEY}

usda:
  api:
    key: ${USDA_API_KEY}

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

server:
  port: 8443
  ssl:
    key-store: classpath:keystore.p12
    key-store-password: password
    key-store-type: PKCS12
    key-alias: tomcat
