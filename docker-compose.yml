services:
  # 1. The Database (PostgreSQL)
  postgres:
    container_name: digout-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digout_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digout_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The Spring Boot Backend
  digout-backend:
    container_name: digout-backend
    image: digout-backend:latest
    build: .
    ports:
      - "8443:8443"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/digout_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-password}
      # Forward secrets
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - USDA_API_KEY=${USDA_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-599673748564-91607cjjv7fdd1c7n7erri8bc9mbl6mq.apps.googleusercontent.com}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-DigoutSecKey2026DigoutSecKey2026}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-1x0000000000000000000000000000000AA}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8443/api/scan/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M

  # 3. The React Frontend
  digout-frontend:
    container_name: digout-frontend
    image: digout-frontend:latest
    build: ./frontend
    ports:
      - "5173:8080"
    environment:
      # Tell Vite where the backend is (if it uses env variables)
      - VITE_API_URL=https://localhost:8443
      - DOCKER_ENV=true
    depends_on:
      digout-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
