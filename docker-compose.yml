version: '3.8'

services:
  # 1. The Database (MySQL)
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306" # Exposing on 3307 to avoid conflict if you already have MySQL on 3306
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=digout_db
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. The Spring Boot Backend
  digout-backend:
    build: .
    ports:
      - "8443:8443"
    environment:
      # Connect to the dockerized MySQL instead of host.docker.internal
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/digout_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
      # Forward secrets
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - USDA_API_KEY=${USDA_API_KEY}
    depends_on:
      - mysql

  # 3. The React Frontend
  digout-frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Tell Vite where the backend is (if it uses env variables)
      - VITE_API_URL=https://localhost:8443
      - DOCKER_ENV=true
    depends_on:
      - digout-backend

volumes:
  mysql_data:
