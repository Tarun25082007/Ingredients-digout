services:
  # 1. The Database (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=digout_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. The Spring Boot Backend
  digout-backend:
    build: .
    ports:
      - "8443:8443"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/digout_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      # Forward secrets
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - USDA_API_KEY=${USDA_API_KEY}
    depends_on:
      - postgres

  # 3. The React Frontend
  digout-frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Tell Vite where the backend is (if it uses env variables)
      - VITE_API_URL=https://localhost:8443
      - DOCKER_ENV=true
    depends_on:
      - digout-backend

volumes:
  postgres_data:
